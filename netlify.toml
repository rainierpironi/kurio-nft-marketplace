[build]
  command = "npm install --legacy-peer-deps && npm run build"
  publish = "dist"

[[headers]]
  for = "/mockServiceWorker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
